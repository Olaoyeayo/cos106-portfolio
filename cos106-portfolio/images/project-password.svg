<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect width="640" height="400" fill="#eef2f6"/>
<rect x="30" y="24" width="580" height="352" rx="12" fill="#fff" stroke="#d6dde5"/>
<rect x="30" y="24" width="580" height="36" rx="12" fill="#0b2f52"/><rect x="30" y="48" width="580" height="12" fill="#0b2f52"/>
<circle cx="52" cy="42" r="5" fill="#e2463c"/><circle cx="68" cy="42" r="5" fill="#f0a830"/><circle cx="84" cy="42" r="5" fill="#3cc77b"/>
<text x="320" y="47" font-size="14" fill="#fff" text-anchor="middle">Password Strength Checker</text>
<text x="320" y="118" font-size="22" font-weight="700" fill="#0b2f52" text-anchor="middle">How strong is your password?</text>
<rect x="140" y="140" width="360" height="44" rx="8" fill="#fff" stroke="#12a89a" stroke-width="2"/>
<text x="158" y="169" font-size="20" fill="#1d2733" letter-spacing="4">••••••••••••</text>
<rect x="140" y="200" width="360" height="12" rx="6" fill="#dde3ea"/><rect x="140" y="200" width="270" height="12" rx="6" fill="#3cc77b"/>
<text x="140" y="236" font-size="14" font-weight="700" fill="#2e9e5c">Strong</text>
<circle cx="150" cy="266" r="7" fill="#3cc77b"/><text x="166" y="271" font-size="13" fill="#1d2733">At least 12 characters</text><circle cx="150" cy="292" r="7" fill="#3cc77b"/><text x="166" y="297" font-size="13" fill="#1d2733">Upper and lower case letters</text><circle cx="150" cy="318" r="7" fill="#3cc77b"/><text x="166" y="323" font-size="13" fill="#1d2733">Contains numbers</text><circle cx="150" cy="344" r="7" fill="#e2463c"/><text x="166" y="349" font-size="13" fill="#1d2733">Add a special character (!@#)</text>
</svg>